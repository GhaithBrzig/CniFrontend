<table class="table table-hover table-striped">
  <thead>
  <tr>
    <th scope="col">#</th>
    <th scope="col">First Name</th>
    <th scope="col">Last Name</th>
    <th scope="col">Username</th>
    <th scope="col">Email</th>
    <th scope="col">Action</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let c of clients; let i = index">
    <th class="align-middle" scope="row">{{ c.idClient }}</th>
    <td class="align-middle">{{ c.nom }}</td>
    <td class="align-middle">{{ c.prenom }}</td>
    <td class="align-middle">{{ c.username }}</td>
    <td class="align-middle">{{ c.email }}</td>
    <td class="align-middle">
      <button type="button" class="btn btn-danger" (click)="deleteUser(c.idClient, i)">
        Delete
      </button>
    </td>
  </tr>
  </tbody>
</table>
